# The Supervisor can manage workloads in the models namespace only. No cluster-wide permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlapi-supervisor
  namespace: mlapi-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlapi-supervisor
  namespace: mlapi-models
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlapi-supervisor
  namespace: mlapi-models
subjects:
  - kind: ServiceAccount
    name: mlapi-supervisor
    namespace: mlapi-system
roleRef:
  kind: Role
  name: mlapi-supervisor
  apiGroup: rbac.authorization.k8s.io
