# A safety net: even a Supervisor bug cannot exceed the capacity set here. Adjust to the node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: models-quota
  namespace: mlapi-models
spec:
  hard:
    pods: "40"
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    requests.storage: 500Gi
    requests.ephemeral-storage: 100Gi
    limits.ephemeral-storage: 100Gi
    persistentvolumeclaims: "40"
    requests.nvidia.com/gpu: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: models-limits
  namespace: mlapi-models
spec:
  limits:
    - type: Container
      max:
        cpu: "8"
        memory: 32Gi
        ephemeral-storage: 20Gi
      default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
