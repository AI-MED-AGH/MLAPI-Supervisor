# The whole platform on one machine: Router + Supervisor + Redis. Models run as sibling containers on this
# host's Docker engine. Only the Router and the (localhost-only) Supervisor admin API publish ports.
#
#   cp .env.example .env      # then fill it in (see docs/runbook.md)
#   docker compose up -d --build
#
# The Router is built from the sibling ../ML-API checkout.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # persistence is off on purpose: queued payloads may be sensitive, and routes/keys are rebuilt from the database
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    networks: [control]   # holds API-key hashes and routes: model containers must not be able to reach it
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # A second Redis only for queue-mode (long-running job) models. Their code may run Lua scripts against it, and a
  # script can hang a Redis server, so the queues must not share an instance with routes and API keys.
  queue-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${QUEUE_REDIS_PASSWORD:?set QUEUE_REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no",
              "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    networks: [models]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${QUEUE_REDIS_PASSWORD}

  supervisor:
    build: .
    image: mlapi-supervisor:local
    container_name: mlapi-supervisor   # fixed so DOCKER_PEERS can name it
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      queue-redis: {condition: service_healthy}
    environment:
      CLUSTER_BACKEND: docker
      DOCKER_NETWORK: mlapi-models                     # where the queue Redis is
      DOCKER_ISOLATE_MODELS: "true"                    # each model gets a network of its own: models cannot reach each other
      DOCKER_PEERS: mlapi-router,mlapi-supervisor      # the containers attached to every model's network (names below)
      DATA_DIR: /data
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QUEUE_REDIS_URL: redis://:${QUEUE_REDIS_PASSWORD}@queue-redis:6379/0
      MODEL_REDIS_URL: redis://queue-redis:6379/0
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:?set ADMIN_API_KEYS in .env (python -m app.admin_key)}
      QUEUE_ACL_SECRET: ${QUEUE_ACL_SECRET:-}
      QUEUE_LEGACY_ACL: ${QUEUE_LEGACY_ACL:-false}
      GHCR_ORG: ${GHCR_ORG:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}              # keeps admin UI sessions across restarts
    volumes:
      - supervisor_data:/data
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent on this host: run only on a trusted device
    ports:
      - "127.0.0.1:${SUPERVISOR_PORT:-8001}:8000"     # admin API, localhost only
    networks: [control, models]

  router:
    build: ../ML-API
    image: mlapi-router:local
    container_name: mlapi-router       # fixed so DOCKER_PEERS can name it
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "${ROUTER_BIND:-127.0.0.1}:${ROUTER_PORT:-8000}:8000"
    networks: [control, models]

volumes:
  supervisor_data:

# `models` is where model containers run (and the queue Redis they use). `control` is for the platform's own state (Redis
# with keys and routes, the optional database): it is internal, so nothing on it can reach out, and no model joins it.
networks:
  models:
    name: mlapi-models
  control:
    name: mlapi-control
    internal: true
